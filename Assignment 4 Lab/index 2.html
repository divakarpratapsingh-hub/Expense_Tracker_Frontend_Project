<!DOCTYPE html>
<html>
<head>
    <title>ShopDynamic</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-dark bg-dark p-3">
        <div class="container">
            <h3 class="text-white">ShopDynamic</h3>
            <span class="text-white">Shopping Cart</span>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">

            <!-- Products Section -->
            <div class="col-md-8">
                <h2>Our Products</h2>
                <div class="row" id="productList"></div>
            </div>

            <!-- Cart Section -->
            <div class="col-md-4">
                <div class="cart">
                    <h3>Shopping Cart</h3>

                    <div id="cartItems">
                        Your cart is empty.
                    </div>

                    <hr>

                    <h4>Grand Total: ₹<span id="total">0</span></h4>
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
